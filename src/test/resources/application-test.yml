# Test configuration for unit and integration tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: embedded
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# Minimal logging for tests
logging:
  level:
    com.enterprise.api: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.testcontainers: INFO

# Test specific application settings
app:
  jwt:
    secret: testSecretKeyForTestingOnlyMustBe32CharsLong123456789
    expiration: 60000 # 1 minute for fast test execution
  
  file:
    upload-dir: ./test-uploads
    max-size: 1048576 # 1MB for tests
  
  captcha:
    expiration: 60000 # 1 minute for tests
  
  otp:
    expiration: 60000 # 1 minute for tests
  
  external:
    email:
      enabled: true
    sms:
      enabled: true
    file-storage:
      enabled: true

# Disable SpringDoc for tests to avoid compatibility issues
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false