# Default application configuration
spring:
  application:
    name: enterprise-spring-boot-api
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
  
  # HikariCP Configuration
  datasource:
    hikari:
      pool-name: EnterpriseAPIPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: false
      connection-test-query: SELECT 1
      validation-timeout: 5000
      register-mbeans: true
  
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  
  cache:
    type: simple

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,hikaricp
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    caches:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    enable:
      hikaricp: true
      cache: true
      jvm: true
      system: true
      jdbc: true
    export:
      simple:
        enabled: true

# Application specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: ${FILE_MAX_SIZE:10485760} # 10MB in bytes
    allowed-types: ${FILE_ALLOWED_TYPES:image/jpeg,image/png,image/gif,application/pdf,text/plain}
  
  captcha:
    length: ${CAPTCHA_LENGTH:6}
    expiration: ${CAPTCHA_EXPIRATION:300000} # 5 minutes in milliseconds
  
  otp:
    default-expiration-minutes: ${OTP_DEFAULT_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    rate-limit-window-minutes: ${OTP_RATE_LIMIT_WINDOW_MINUTES:15}
    max-requests-per-window: ${OTP_MAX_REQUESTS_PER_WINDOW:5}
    lock-duration-minutes: ${OTP_LOCK_DURATION_MINUTES:30}
    max-failed-attempts: ${OTP_MAX_FAILED_ATTEMPTS:10}
    code-length: ${OTP_CODE_LENGTH:6}
    numeric-only: ${OTP_NUMERIC_ONLY:true}
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# Logging configuration
logging:
  level:
    com.enterprise.api: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
    displayOperationId: false
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 1
    docExpansion: none
    persistAuthorization: true
    supportedSubmitMethods: ["get", "post", "put", "delete", "patch", "head", "options"]
  show-actuator: true
  show-login-endpoint: true
  group-configs:
    - group: 'authentication'
      display-name: 'Authentication APIs'
      paths-to-match: '/api/v1/auth/**'
    - group: 'user-management'
      display-name: 'User Management APIs'
      paths-to-match: '/api/v1/users/**'
    - group: 'file-management'
      display-name: 'File Management APIs'
      paths-to-match: '/api/files/**'
    - group: 'security-features'
      display-name: 'Security Features APIs'
      paths-to-match: '/api/captcha/**,/api/v1/otp/**'
    - group: 'batch-processing'
      display-name: 'Batch Processing APIs'
      paths-to-match: '/api/v1/batch/**'
    - group: 'role-management'
      display-name: 'Role Management APIs'
      paths-to-match: '/api/v1/roles/**'